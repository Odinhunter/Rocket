<title>Feed Reaction Study — moderator kiosk</title>
<style>
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", "Cascadia Code", "Roboto Mono", Menlo, Consolas, monospace;
    --ground: #F3F4F7; --surface: #FFFFFF; --surface-2: #FAFBFC;
    --ink: #191C22; --muted: #5A626E; --faint: #8A92A0; --line: #E3E6EB;
    --accent: #DB7C1E; --accent-ink: #8A4E0E; --accent-tint: rgba(219,124,30,0.10);
    --ok: #2C7A57; --danger: #B4453A;
    --shadow: 0 1px 2px rgba(20,24,33,.04), 0 8px 30px rgba(20,24,33,.07);
    --maxw: 500px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #111318; --surface: #191D24; --surface-2: #1F242C;
      --ink: #EAEDF2; --muted: #9AA2AE; --faint: #6C7480; --line: #282E38;
      --accent: #F0913A; --accent-ink: #F7B472; --accent-tint: rgba(240,145,58,.14);
      --ok: #5FBE8F; --danger: #E0796C;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 34px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="light"]{--ground:#F3F4F7;--surface:#FFFFFF;--surface-2:#FAFBFC;--ink:#191C22;--muted:#5A626E;--faint:#8A92A0;--line:#E3E6EB;--accent:#DB7C1E;--accent-ink:#8A4E0E;--accent-tint:rgba(219,124,30,.10);--ok:#2C7A57;--danger:#B4453A;--shadow:0 1px 2px rgba(20,24,33,.04),0 8px 30px rgba(20,24,33,.07);}
  :root[data-theme="dark"]{--ground:#111318;--surface:#191D24;--surface-2:#1F242C;--ink:#EAEDF2;--muted:#9AA2AE;--faint:#6C7480;--line:#282E38;--accent:#F0913A;--accent-ink:#F7B472;--accent-tint:rgba(240,145,58,.14);--ok:#5FBE8F;--danger:#E0796C;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 34px rgba(0,0,0,.45);}

  * { box-sizing: border-box; }
  body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--font-sans); font-size:16px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:var(--maxw); margin:0 auto; padding:22px 18px 108px; min-height:100dvh; }

  .eyebrow { font-family:var(--font-mono); font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent-ink); font-weight:600; }
  h1 { font-size:25px; line-height:1.18; margin:8px 0 0; font-weight:700; text-wrap:balance; letter-spacing:-.01em; }
  h2 { font-size:19px; line-height:1.25; margin:0; font-weight:650; letter-spacing:-.01em; }
  p { margin:11px 0; color:var(--muted); }
  p.lead { color:var(--ink); }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:20px; box-shadow:var(--shadow); }
  .hidden { display:none !important; }

  /* kiosk home */
  .khome { text-align:center; padding-top:6vh; }
  .bignum { font-family:var(--font-mono); font-size:64px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; margin:6px 0 2px; }
  .bignum small { font-family:var(--font-sans); font-size:14px; color:var(--muted); font-weight:500; display:block; letter-spacing:.02em; margin-top:8px; }
  .backup { margin-top:16px; font-size:14px; border-radius:11px; padding:10px 13px; }
  .backup.warn { background:var(--accent-tint); color:var(--accent-ink); border:1px solid var(--accent); }
  .backup.calm { color:var(--faint); }

  /* chips (demographics) */
  .fieldset { margin-top:18px; }
  .fieldset > .lab { font-family:var(--font-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:9px; }
  .chip { border:1px solid var(--line); background:var(--surface-2); color:var(--ink); border-radius:999px; padding:9px 15px; font-size:14.5px; cursor:pointer; font-family:var(--font-sans); transition:border-color .12s, background .12s; }
  .chip:hover { border-color:var(--accent); }
  .chip.sel { border-color:var(--accent); background:var(--accent-tint); color:var(--accent-ink); font-weight:600; }

  /* questions */
  .q { margin-top:17px; }
  .q .lab { font-weight:600; font-size:15.5px; }
  .q input[type=text] { width:100%; margin-top:8px; background:var(--surface-2); color:var(--ink); border:1px solid var(--line); border-radius:10px; padding:11px 12px; font-family:var(--font-sans); font-size:16px; transition:border-color .15s, box-shadow .15s; }
  .q input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-tint); }
  .q input::placeholder { color:var(--faint); }

  .divider { display:flex; align-items:center; gap:12px; margin:26px 0 4px; }
  .divider::before, .divider::after { content:""; height:1px; flex:1; background:var(--line); }
  .divider span { font-family:var(--font-mono); font-size:11.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent-ink); white-space:nowrap; }

  fieldset { border:0; margin:0; padding:0; }
  legend { padding:0; font-weight:600; font-size:15.5px; }
  .choices { display:flex; flex-direction:column; gap:8px; margin-top:11px; }
  .choice { display:flex; align-items:flex-start; gap:11px; border:1px solid var(--line); background:var(--surface-2); border-radius:12px; padding:12px 13px; cursor:pointer; transition:border-color .12s, background .12s, transform .05s; }
  .choice:hover { border-color:var(--accent); }
  .choice:active { transform:scale(.994); }
  .choice input { position:absolute; opacity:0; width:1px; height:1px; }
  .dot { flex:0 0 auto; width:19px; height:19px; border-radius:50%; border:2px solid var(--faint); margin-top:1px; position:relative; transition:border-color .12s; }
  .choice input:checked ~ .dot { border-color:var(--accent); }
  .choice input:checked ~ .dot::after { content:""; position:absolute; inset:3px; border-radius:50%; background:var(--accent); }
  .choice:has(input:checked) { border-color:var(--accent); background:var(--accent-tint); }
  .choice input:focus-visible ~ .dot { box-shadow:0 0 0 3px var(--accent-tint); }
  .choice .t { font-weight:600; font-size:15px; }
  .choice .d { color:var(--muted); font-size:13px; margin-top:1px; }

  /* buttons / sticky bar */
  .actions { position:fixed; left:0; right:0; bottom:0; z-index:6; background:linear-gradient(to top, var(--ground) 64%, transparent); padding:14px 18px calc(14px + env(safe-area-inset-bottom)); }
  .actions__in { max-width:var(--maxw); margin:0 auto; display:flex; gap:10px; }
  .btn { flex:1; display:flex; align-items:center; justify-content:center; gap:8px; border:0; cursor:pointer; background:var(--accent); color:#fff; font-family:var(--font-sans); font-weight:650; font-size:16.5px; padding:15px 18px; border-radius:13px; box-shadow:0 4px 14px var(--accent-tint); transition:filter .15s, transform .05s; }
  .btn:hover { filter:brightness(1.05); }
  .btn:active { transform:translateY(1px); }
  .btn:focus-visible { outline:3px solid var(--accent-tint); outline-offset:2px; }
  .btn[disabled] { opacity:.4; cursor:not-allowed; filter:none; }
  .btn--ghost { background:transparent; color:var(--ink); border:1px solid var(--line); box-shadow:none; font-weight:600; flex:0 0 auto; padding-left:20px; padding-right:20px; }
  .btn--ghost:hover { border-color:var(--accent); filter:none; }
  .btn--sm { flex:0 0 auto; padding:11px 16px; font-size:14.5px; }

  .foot { font-family:var(--font-mono); font-size:11px; color:var(--faint); text-align:center; letter-spacing:.03em; margin-top:22px; }
  .err { color:var(--danger); font-size:14px; margin-top:12px; min-height:1.1em; }

  /* exposure overlay */
  .stage { position:fixed; inset:0; z-index:40; background:#0B0D11; color:#EAEDF2; display:flex; align-items:center; justify-content:center; flex-direction:column; padding:22px; }
  .count { font-family:var(--font-mono); font-weight:700; font-size:88px; line-height:1; font-variant-numeric:tabular-nums; }
  .count__cap { font-family:var(--font-mono); font-size:12px; letter-spacing:.22em; text-transform:uppercase; color:#8A92A0; margin-top:16px; }
  .flash { width:100%; max-width:440px; border-radius:14px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  .flash img { display:block; width:100%; height:auto; }
  .pop-in { animation:popIn .22s cubic-bezier(.2,.7,.3,1) both; }
  .fade-in { animation:fadeIn .18s ease-out both; }
  @keyframes popIn { from{opacity:0;transform:scale(.965);} to{opacity:1;transform:scale(1);} }
  @keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
  @media (prefers-reduced-motion: reduce){ * { animation-duration:.001ms !important; transition-duration:.05ms !important; } }
</style>

<div class="wrap" id="wrap"></div>
<div class="actions hidden" id="actionbar"><div class="actions__in" id="actionin"></div></div>

vRF1QeUJnsganT2DLHjWNH9bWiR5vpa3UuMX6VG/Wr1J0MqZKu0/ZVzoUt49qaCDMu7PdKNu6R3zxJzOQz2mhcI9ujcfXGuwY/sr1Gx7E8o+slv+7cK94wcK1SVwuRX8LxQ1p8b/ifyqvS1Pgr0iTgbczRkc2tnp8TPyMwIzAjMCNwPRH4X3kex0iuEhHCAAAAAElFTkSuQmCC";

const ACTIONS = [
  ["scroll_past","Scroll past","kept scrolling — it didn't stop them"],
  ["linger","Stop & look","stopped and looked, no tap"],
  ["tap_cta","Tap through","tapped it to see more"],
  ["save","Save it","bookmarked for later"],
  ["share","Send it","sent it to someone / posted"],
];
const NEXT_STEPS = [
  ["buy_now","Buy now","order it right away"],
  ["buy_at_restock","Buy next restock","buy when they next run out"],
  ["research_first","Look it up first","compare before deciding"],
  ["mention_to_someone","Mention it","wouldn't buy, but would tell someone"],
  ["nothing","Nothing","do nothing further"],
];
const AGE = ["18–24","25–34","35–44"];
const CITY = ["Metro","Tier-2","Tier-3"];
const INCOME = ["<₹3.5L","₹3.5–7L","₹7–17L","₹17–40L","₹40L+"];

const wrap = document.getElementById("wrap");
const actionbar = document.getElementById("actionbar");
const actionin = document.getElementById("actionin");
let cur = {};   // the participant being recorded

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function load(){ try { return JSON.parse(localStorage.getItem(STORE_KEY)||"[]"); } catch { return []; } }
function persist(arr){ localStorage.setItem(STORE_KEY, JSON.stringify(arr)); }
function hideBar(){ actionbar.classList.add("hidden"); }
function showBar(html){ actionin.innerHTML = html; actionbar.classList.remove("hidden"); }

/* ---------------- kiosk home ---------------- */
function home(){
  hideBar();
  const arr = load();
  const n = arr.length;
  const lastExp = parseInt(localStorage.getItem(EXPORT_KEY)||"0", 10);
  const since = n - lastExp;
  const warn = since >= BACKUP_EVERY;
  wrap.innerHTML = `
    <div class="khome fade-in">
      <div class="eyebrow">Feed reaction study</div>
      <div class="bignum">${n}<small>saved on this device</small></div>
      ${n ? `<div class="backup ${warn?'warn':'calm'}">${warn
          ? `⚠ ${since} new since your last export — back up now.`
          : `stored only on this device — export regularly.`}</div>` : ""}
      <p class="lead" style="margin-top:20px;">Screen the person first. When they qualify, run one session — about a minute.</p>
    </div>`;
  showBar(`<button class="btn" id="start">Start next person &nbsp;&rarr;</button>
           <button class="btn btn--ghost btn--sm" id="exp" ${n?'':'disabled'}>Export (${n})</button>`);
  document.getElementById("start").onclick = startParticipant;
  document.getElementById("exp").onclick = exportAll;
}

function exportAll(){
  const arr = load();
  if (!arr.length) return;
  const blob = new Blob([JSON.stringify(arr, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,"-");
  a.href = URL.createObjectURL(blob);
  a.download = `rocket_panel_${arr.length}_${stamp}.json`;
  a.click();
  localStorage.setItem(EXPORT_KEY, String(arr.length));
  setTimeout(home, 400);
}

/* ---------------- participant: demographics + ready ---------------- */
function startParticipant(){
  const seq = load().length + 1;
  cur = { id: "P" + String(seq).padStart(3,"0"), ts: new Date().toISOString(),
          age_band:"", city_tier:"", income_band:"" };
  hideBar();
  const chipRow = (name, opts) => `<div class="chips" data-group="${name}">` +
      opts.map(o => `<button type="button" class="chip" data-val="${esc(o)}">${esc(o)}</button>`).join("") + `</div>`;
  wrap.innerHTML = `
    <div class="fade-in">
      <div class="eyebrow">${cur.id}</div>
      <h1>Quick tags, then the glance</h1>
      <p class="lead">Tap their rough bracket (for the mix — not shown to them).</p>
      <div class="card">
        <div class="fieldset"><div class="lab">Age</div>${chipRow("age_band", AGE)}</div>
        <div class="fieldset"><div class="lab">City</div>${chipRow("city_tier", CITY)}</div>
        <div class="fieldset"><div class="lab">Income</div>${chipRow("income_band", INCOME)}</div>
      </div>
      <p style="margin-top:20px;" class="lead"><strong>Hand them the phone.</strong> When you tap start, an image shows for ~2 seconds then disappears. Tell them: glance the way you'd scroll your feed — don't study it.</p>
      <div class="err" id="err"></div>
    </div>`;
  wrap.querySelectorAll(".chips").forEach(group => {
    group.addEventListener("click", e => {
      const chip = e.target.closest(".chip"); if (!chip) return;
      group.querySelectorAll(".chip").forEach(c => c.classList.remove("sel"));
      chip.classList.add("sel");
      cur[group.dataset.group] = chip.dataset.val;
    });
  });
  showBar(`<button class="btn btn--ghost btn--sm" id="cancel">Cancel</button>
           <button class="btn" id="go">Start the glance &nbsp;&rarr;</button>`);
  document.getElementById("cancel").onclick = home;
  document.getElementById("go").onclick = () => {
    if (!cur.age_band || !cur.city_tier || !cur.income_band){
      document.getElementById("err").textContent = "Tap one in each row first.";
      return;
    }
    runExposure();
  };
}

/* ---------------- exposure ---------------- */
function runExposure(){
  hideBar();
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const stage = document.createElement("div"); stage.className = "stage";
  document.body.appendChild(stage);
  const counts = reduce ? ["Ready"] : ["3","2","1"];
  let i = 0;
  (function tick(){
    if (i < counts.length){ stage.innerHTML = `<div class="count pop-in">${counts[i]}</div><div class="count__cap">get ready</div>`; i++; setTimeout(tick, reduce?700:600); }
    else showAd(stage);
  })();
}
function showAd(stage){
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const img = new Image(); img.src = AD_SRC;
  const paint = () => {
    stage.innerHTML = `<div class="flash ${reduce?'':'pop-in'}"><img src="${AD_SRC}" alt="feed image"></div>`;
    const t0 = performance.now();
    setTimeout(() => { cur.exposure_ms = Math.round(performance.now()-t0); stage.remove(); questions(); }, EXPOSURE_MS);
  };
  if (img.complete) paint(); else img.onload = paint;
  setTimeout(() => { if (document.body.contains(stage) && !stage.querySelector(".flash")) paint(); }, 1200);
}

/* ---------------- questions (one scroll) ---------------- */
function q(id, lab, ph){ return `<div class="q"><div class="lab">${esc(lab)}</div><input type="text" id="${id}" autocomplete="off" placeholder="${esc(ph)}"></div>`; }
function picks(name, opts){
  return `<fieldset><legend id="${name}_lg">${name==="action"?"And their thumb — what did it do?":"So what would they do next about it?"}</legend>
    <div class="choices">` + opts.map(([v,t,d]) =>
      `<label class="choice"><input type="radio" name="${name}" value="${v}"><span class="dot"></span><span><span class="t">${esc(t)}</span><span class="d">${esc(d)}</span></span></label>`).join("") + `</div></fieldset>`;
}
function questions(){
  wrap.scrollTo?.(0,0); window.scrollTo(0,0);
  wrap.innerHTML = `
    <div class="fade-in">
      <div class="eyebrow">${cur.id} · the glance</div>
      <h2>Straight after the image</h2>
      <p style="margin-top:2px;font-size:14px;">Ask out loud, jot a few words. Short is fine — "nothing" is a real answer.</p>
      ${q("r1","First thing through their head?","before they really think…")}
      ${q("r2","What's it selling — who's it for? Feels like them?","who comes to mind…")}
      ${q("r3","Catch their interest, or wash over them?","")}
      ${picks("action", ACTIONS)}

      <div class="divider"><span>Now — imagine it's a day or two later</span></div>
      <p style="margin-top:2px;font-size:14px;">No looking back at the image — just from memory.</p>
      ${q("r4","What do they remember about it?","")}
      ${q("r5","Would they mention it to anyone — who?","")}
      ${q("r6","One thing that'd hold them back?","the friction…")}
      ${picks("next_step", NEXT_STEPS)}
      <div class="err" id="err"></div>
    </div>`;
  showBar(`<button class="btn btn--ghost btn--sm" id="discard">Discard</button>
           <button class="btn" id="save">Save &amp; next &nbsp;&rarr;</button>`);
  document.getElementById("discard").onclick = () => { if (confirm("Discard this person's session?")) home(); };
  document.getElementById("save").onclick = saveSession;
}
function val(id){ return (document.getElementById(id).value||"").trim(); }
function saveSession(){
  const action = document.querySelector('input[name=action]:checked');
  const next_step = document.querySelector('input[name=next_step]:checked');
  const err = document.getElementById("err");
  if (!action){ err.textContent = "Pick what their thumb did."; document.getElementById("action_lg").scrollIntoView({behavior:"smooth"}); return; }
  if (!next_step){ err.textContent = "Pick what they'd do next."; return; }
  const rec = { v:"reaction-v3-human-kiosk", ...cur,
    r1:val("r1"), r2:val("r2"), r3:val("r3"), action:action.value, action_why:"",
    r4:val("r4"), r5:val("r5"), r6:val("r6"), next_step:next_step.value, next_step_why:"",
    saved_at:new Date().toISOString() };
  const arr = load(); arr.push(rec); persist(arr);
  // brief confirmation, then straight to the next person
  hideBar();
  wrap.innerHTML = `<div class="khome fade-in"><div class="eyebrow">saved</div>
    <div class="bignum" style="color:var(--ok)">✓</div>
    <h1 style="margin-top:6px;">${cur.id} saved</h1>
    <p class="lead">${arr.length} total on this device.</p></div>`;
  const since = arr.length - parseInt(localStorage.getItem(EXPORT_KEY)||"0",10);
  showBar(`<button class="btn" id="next">Next person &nbsp;&rarr;</button>
           ${since>=BACKUP_EVERY?`<button class="btn btn--ghost btn--sm" id="exp">Export (${arr.length})</button>`:""}`);
  document.getElementById("next").onclick = startParticipant;
  const e = document.getElementById("exp"); if (e) e.onclick = exportAll;
}

home();
</script>
